<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat Assistant</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
<div class="w-full max-w-2xl h-[90vh] bg-white rounded-2xl shadow-xl flex flex-col">
  <div class="bg-indigo-600 text-white p-4 rounded-t-2xl">
    <h1 class="text-lg font-bold">AI Chat Assistant</h1>
    <p class="text-xs opacity-80">Powered by FastAPI + LLM API</p>
  </div>
  <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
  <div class="p-4 border-t flex gap-2">
    <input id="input" type="text" placeholder="Type a message..."
      class="flex-1 border rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500">
    <button onclick="send()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Send</button>
  </div>
</div>
<script>
let token = localStorage.getItem('token') || '';
function addMsg(text, role) {
  const box = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = role === 'user' ? 'text-right' : 'text-left';
  div.innerHTML = `<div class="inline-block px-3 py-2 rounded-lg max-w-[80%] ${
    role === 'user' ? 'bg-indigo-600 text-white' : 'bg-gray-200'}">${text}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
async function send() {
  const inp = document.getElementById('input');
  const text = inp.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  inp.value = '';
  const r = await fetch('/api/chat/send?token=' + token, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({message: text})
  });
  const data = await r.json();
  addMsg(data.reply || 'Error', 'assistant');
}
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});
</script>
</body>
</html>
